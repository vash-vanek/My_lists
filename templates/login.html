<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Вход</h1>
    <nav>
        <a href="/main_page">Вернуться на главную</a><br><br>

        {% if error == 'invalid' %}
        <p style="color: red;">Неверное имя пользователя или пароль.</p>
        {% endif %}

        <form method="post" action="/login_page">
            <input type="text" name="username" placeholder="Имя пользователя" autocomplete="new-password" required><br>
            <input type="password" name="password" placeholder="Пароль" autocomplete="new-password" required><br>
            <button type="submit">Войти</button><br><br>
            <a href="/register_page">Зарегестрировать аккаунт</a>
        </form>
    </nav>
</body>
</html>
