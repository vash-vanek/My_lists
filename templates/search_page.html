<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Поиск</h1>
    <nav>
        <a href="/main_page">Вернуться на главную</a> <br><br><br>

        <form method="get" action="/search_page">
            <input type="text" name="q" autocomplete="off" required><br>
            <button type="submit">Поиск</button>

        </form>
        {% if searched %}
            {% if results %}
                {% for note in results %}
                    <a href="/edit_note_page/{{ note['id'] }}">{{ note['title'] }}</a>
                    <p>{{ note['content'] }}</p><br>
                {% endfor %}
            {% else %}
                <p>Ничего не найдено</p>
            {% endif %}
        {% endif %}
    </nav>

</body>
</html>
