<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование заметки</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Редактирование заметки</h1>
    <nav>
        <form method="post" action="/edit_note_page/{{ note["id"] }}">
            <label>Название: </label>
            <input type="text" name="title" value="{{ note["title"] }}" autocomplete="off" required><br>

            <label>Текст заметки: </label>
            <textarea name="content" rows="5" cols="40" required>{{ note["content"] }}</textarea><br>

            <label>Ктаегория: </label>
            <select name="category_id">
                {% for cat in categories %}
                <option value="{{ cat['id'] }}"{% if cat['id'] == note['category_id'] %}selected{% endif %}>{{ cat['name'] }}</option>
                {% endfor %}
            </select><br>

            <label>Дата создания: </label>
            <p>{{ note["created_at"] }}</p><br><br>

            <button type="submit">Сохранить</button>
            </form>

            <form method="post" action="/delete_note_page/{{ note['id'] }}">
            <button type="submit">Удалить</button>
            </form>
    </nav>

</body>
</html>
