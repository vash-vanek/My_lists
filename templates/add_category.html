<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание категории</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Создание категории</h1> 
    <nav>
        
        <a href="/main_page">Вернуться на главную</a> <br><br><br>
        {% if error == 'exists' %}
            <p style="color: red;">Категория с таким именем уже существует.</p>
        {% endif %}

        <form method="post" action="/create_category">
            <input type="text" name="name" placeholder="Введите название" autocomplete="off" required><br>

            <button type="submit">Сохранить</button>
        </form>

    </nav>

</body>
</html>
