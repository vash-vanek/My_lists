<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание заметки</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Создание заметки</h1> 
    <nav>
        
        <a href="/main_page">Вернуться на главную</a> <br><br><br>
        {% if error == 'duplicate' %}
            <p style="color: red;">Такая заметка уже существует.</p>
        {% endif %}
        <form method="post" action="/add_note_page">
            <input type="text" name="title" placeholder="Введите название" autocomplete="off" required><br>

            <textarea name="content" rows="5" cols="40" required></textarea><br>

            <label>Выбрать категорию</label><br>
            <select name="category_id">
                {% for cat in categories %}
                <option value={{ cat["id"] }}>{{ cat["name"] }}</option>
                {% endfor %}
            </select><br>

            <button type="submit">Сохранить</button>
        </form>

    </nav>

</body>
</html>
